name: Bug
description: Incorrect parse/cluster result, panic, or docs/API mismatch
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Redaction misses are in scope when you can share a sanitized repro line.
        Do not paste real tokens, passwords, or personal data.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Function, inputs, and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Result you expected from the public API.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What the crate returned, or the panic/error.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: "0.1.0 or git SHA"
    validations:
      required: true

  - type: input
    id: rustc
    attributes:
      label: rustc
      placeholder: "rustc 1.80.0 (from rustc -V)"
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: Short snippet using the public API, with secrets replaced by placeholders.
      render: rust
    validations:
      required: false
