name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

      - name: Extract changelog section
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0; n = 0 }
            {
              prefix = "## [" ver "]"
              if (!found && index($0, prefix) == 1) {
                found = 1
                next
              }
              if (found && $0 ~ /^## \[/) exit
              if (found) lines[++n] = $0
            }
            END {
              if (!found) {
                print "No CHANGELOG.md section for " ver > "/dev/stderr"
                exit 1
              }
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              end = n
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              if (end < start) {
                print "Empty CHANGELOG.md section for " ver > "/dev/stderr"
                exit 1
              }
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
